name: Validate skill tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated project-tool tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check dsh-plugin assets are in sync
        run: python scripts/sync_dsh.py --check
